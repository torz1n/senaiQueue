<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Essa meta tag é essencial no mobile-first: sem ela o celular
       mostra a página "encolhida", como se fosse um site de desktop. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Avisa ao navegador que a página tem tema claro e escuro, para ele
       adaptar também as partes que ele mesmo desenha (barra de rolagem,
       preenchimento automático etc.). -->
  <meta name="color-scheme" content="light dark">

  <!-- Cor da barra do navegador no celular. O script.js atualiza este
       valor sempre que o tema muda. -->
  <meta name="theme-color" content="#F4F6F8">

  <title>Fila</title>

  <!-- ESCOLHA DO TEMA (precisa ficar aqui no <head>, antes do CSS):
       este mini-script roda ANTES de a página ser desenhada e define se
       começamos no claro ou no escuro. Se ele ficasse só no script.js
       (que carrega no fim do <body>), a pessoa veria a tela clara por
       um instante antes de virar escura (um "piscar" feio).
       Ordem de decisão: 1) o que a pessoa escolheu no botão e ficou
       salvo; 2) se nunca escolheu, o tema do celular/computador dela. -->
  <script>
    (function () {
      let tema = null;
      try {
        tema = localStorage.getItem("tema"); // mesma chave usada no script.js
      } catch (erro) {
        // localStorage bloqueado: segue sem a preferência salva.
      }
      if (tema !== "light" && tema !== "dark") {
        tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", tema);
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <header class="topo">
      <div>
        <!-- A bolinha é só decoração (tema ping pong), por isso aria-hidden:
             leitores de tela vão ignorar. -->
        <h1><span class="bolinha" aria-hidden="true"></span>Fila</h1>
        <p class="subtitulo">Digite seu nome para entrar na fila.</p>
      </div>

      <!-- O botão de alternar tema NÃO está escrito aqui de propósito:
           ele é criado pelo script.js (seção 7) e colocado dentro deste
           cabeçalho, no canto direito. -->
    </header>

    <!-- Usamos <form> de propósito: com um botão type="submit" dentro,
         o navegador já dispara o evento "submit" ao apertar Enter.
         Assim não precisamos escrever código extra para o Enter. -->
    <form id="formulario" class="formulario" novalidate>
      <label for="campo-nome" class="sr-somente">Seu nome</label>
      <input
        id="campo-nome"
        type="text"
        placeholder="Seu nome"
        maxlength="30"
        autocomplete="off"
      >
      <button id="botao-entrar" class="botao-principal" type="submit">Entrar na fila</button>
    </form>

    <!-- Mensagem de erro de validação. aria-live faz leitores de tela
         anunciarem o erro quando o texto aparecer. -->
    <p id="mensagem-erro" class="erro" aria-live="polite"></p>

    <!-- Aparece depois que este dispositivo entrou na fila:
         mostra o nome e oferece o botão para sair. -->
    <div id="area-status" class="status escondido" aria-live="polite">
      <span id="texto-status"></span>
      <button id="botao-sair" type="button" class="botao-sair">Sair da fila</button>
    </div>

    <section class="fila">
      <p id="contador" class="contador" aria-live="polite"></p>

      <!-- A lista fica vazia no HTML: quem a preenche é o renderizar(). -->
      <ul id="lista-fila" class="lista-fila"></ul>

      <p id="mensagem-vazia" class="vazio">
        A fila está vazia. Que tal ser o primeiro? 🏓
      </p>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
